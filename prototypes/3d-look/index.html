<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Cargo Panic - 3D look prototype</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b1017; overflow: hidden; }
  canvas { display: block; }
  #hud {
    position: fixed; top: 10px; left: 10px; color: #8fa2ba;
    font: 13px/1.4 "Trebuchet MS", system-ui, sans-serif; pointer-events: none;
    background: rgba(0,0,0,.45); padding: 6px 9px; border-radius: 8px;
  }
</style>
</head>
<body>
<div id="hud">loading three.js…</div>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
<script type="module">
/*
 * Look prototype only. No gameplay. Renders the same composition as the 2D
 * game - dark warehouse, three warm lamps, one rack, a loaded manifest - in
 * real 3D with PBR materials, shadow maps and bloom, so the two can be
 * compared side by side at the same phone resolution.
 *
 * Everything is procedural: no models, no texture files. That is deliberate.
 * It is the honest ceiling of what code alone can produce; anything closer to
 * photoreal needs authored assets.
 */
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

const hud = document.getElementById('hud');

// ---------------------------------------------------------------------------
// Renderer at device resolution, same policy as the 2D game (cap 2x).
// ---------------------------------------------------------------------------
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
const dpr = Math.min(2, window.devicePixelRatio || 1);
renderer.setPixelRatio(dpr);
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.95;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0b1017);
scene.fog = new THREE.FogExp2(0x0b1017, 0.008);

// Mild perspective, slightly elevated, facing the rack: depth cues without
// distorting the slot columns the puzzle depends on.
const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(0, 5.4, 28);
camera.lookAt(0, 2.7, 0);

// ---------------------------------------------------------------------------
// Procedural materials
// ---------------------------------------------------------------------------
function canvasTex(w, h, draw) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const ctx = c.getContext('2d');
  draw(ctx, w, h);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = 4;
  return t;
}

/** Corrugated cardboard: base colour, faint flute lines, tape strip, label. */
function cardboardTex(base = '#c98a45', tape = true) {
  return canvasTex(256, 256, (ctx, w, h) => {
    ctx.fillStyle = base; ctx.fillRect(0, 0, w, h);
    ctx.globalAlpha = 0.08;
    for (let y = 0; y < h; y += 6) { ctx.fillStyle = y % 12 ? '#000' : '#fff'; ctx.fillRect(0, y, w, 3); }
    ctx.globalAlpha = 1;
    if (tape) {
      ctx.fillStyle = 'rgba(245,220,180,0.75)'; ctx.fillRect(w / 2 - 16, 0, 32, h);
      ctx.fillStyle = 'rgba(60,35,10,0.35)'; ctx.fillRect(w / 2 - 16, 0, 3, h); ctx.fillRect(w / 2 + 13, 0, 3, h);
    }
    ctx.fillStyle = 'rgba(40,20,5,0.35)'; ctx.fillRect(24, 40, 60, 10); ctx.fillRect(24, 58, 42, 10);
  });
}

/** Painted steel with a hazard stripe along the base. */
function crateTex() {
  return canvasTex(256, 256, (ctx, w, h) => {
    ctx.fillStyle = '#4f5b6e'; ctx.fillRect(0, 0, w, h);
    ctx.globalAlpha = 0.12;
    for (let i = 0; i < 600; i++) { ctx.fillStyle = Math.random() > .5 ? '#fff' : '#000';
      ctx.fillRect(Math.random() * w, Math.random() * h, 2, 2); }
    ctx.globalAlpha = 1;
    ctx.fillStyle = '#f0a53c'; ctx.fillRect(0, h - 40, w, 34);
    ctx.fillStyle = '#151a22';
    for (let x = -40; x < w + 40; x += 36) { ctx.beginPath(); ctx.moveTo(x, h); ctx.lineTo(x + 16, h);
      ctx.lineTo(x + 36, h - 40); ctx.lineTo(x + 20, h - 40); ctx.closePath(); ctx.fill(); }
    ctx.fillStyle = 'rgba(0,0,0,.45)'; ctx.fillRect(0, 36, w, 6);
    ctx.fillStyle = 'rgba(255,255,255,.18)';
    for (const [x, y] of [[18, 18], [w - 18, 18], [18, h - 60], [w - 18, h - 60]]) { ctx.beginPath(); ctx.arc(x, y, 5, 0, 7); ctx.fill(); }
  });
}

const M = {
  cardboard: new THREE.MeshStandardMaterial({ map: cardboardTex(), roughness: 0.92, metalness: 0 }),
  long: new THREE.MeshStandardMaterial({ map: cardboardTex('#b8552e', false), roughness: 0.9, metalness: 0 }),
  crate: new THREE.MeshStandardMaterial({ map: crateTex(), roughness: 0.42, metalness: 0.75 }),
  fragile: new THREE.MeshPhysicalMaterial({ color: 0x3f8a8e, roughness: 0.15, metalness: 0.05, transmission: 0.35, thickness: 0.6, ior: 1.4, clearcoat: 0.6 }),
  priority: new THREE.MeshStandardMaterial({ color: 0xd9a52a, roughness: 0.32, metalness: 0.55, emissive: 0x3a2600, emissiveIntensity: 0.6 }),
  steel: new THREE.MeshStandardMaterial({ color: 0x748498, roughness: 0.36, metalness: 0.82 }),
  steelDark: new THREE.MeshStandardMaterial({ color: 0x2c3644, roughness: 0.55, metalness: 0.7, side: THREE.DoubleSide }),
  floor: new THREE.MeshStandardMaterial({ color: 0x131a24, roughness: 0.88, metalness: 0.05 }),
  wall: new THREE.MeshStandardMaterial({ color: 0x1e2a3a, roughness: 0.95, metalness: 0 }),
  lampGlow: new THREE.MeshBasicMaterial({ color: 0xffe6b8 }),
};

// ---------------------------------------------------------------------------
// Warehouse
// ---------------------------------------------------------------------------
const floor = new THREE.Mesh(new THREE.PlaneGeometry(60, 60), M.floor);
floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);

const wall = new THREE.Mesh(new THREE.PlaneGeometry(60, 30), M.wall);
wall.position.set(0, 15, -7); wall.receiveShadow = true; scene.add(wall);

// Distant racking, dark and out of focus by fog.
for (const [x, w, h] of [[-9, 3.2, 8], [-6.2, 1.8, 6], [9.5, 3.6, 8.5], [7, 1.6, 5.5]]) {
  const g = new THREE.Group();
  for (let s = 0; s < 4; s++) {
    const plank = new THREE.Mesh(new THREE.BoxGeometry(w, 0.12, 1.2), M.steelDark);
    plank.position.y = 0.6 + s * (h / 4);
    plank.castShadow = true; plank.receiveShadow = true;
    g.add(plank);
  }
  for (const sx of [-1, 1]) {
    const up = new THREE.Mesh(new THREE.BoxGeometry(0.16, h, 0.16), M.steelDark);
    up.position.set(sx * (w / 2), h / 2, 0); g.add(up);
  }
  g.position.set(x, 0, -4.5); scene.add(g);
}

// Lamps: housing, hot bulb, and a spot that actually casts shadows.
for (const lx of [-3.4, 0, 3.4]) {
  const housing = new THREE.Mesh(new THREE.ConeGeometry(0.55, 0.45, 24, 1, true), M.steelDark);
  housing.position.set(lx, 7.85, 1.5); housing.rotation.x = Math.PI; scene.add(housing);
  const bulb = new THREE.Mesh(new THREE.SphereGeometry(0.16, 16, 12), M.lampGlow);
  bulb.position.set(lx, 7.6, 1.5); scene.add(bulb);

  const spot = new THREE.SpotLight(0xffd9a0, 80, 24, Math.PI / 4.2, 0.6, 1.5);
  spot.position.set(lx, 7.6, 1.5);
  spot.target.position.set(lx * 0.5, 0, 0.5);
  spot.castShadow = true;
  spot.shadow.mapSize.set(1024, 1024);
  spot.shadow.bias = -0.0008;
  spot.shadow.radius = 4;
  scene.add(spot, spot.target);
}
scene.add(new THREE.HemisphereLight(0x4a6088, 0x0a0d12, 0.9));
// Frontal warm key so the box faces - the thing the puzzle is read from - are
// actually lit, with its own shadow so cargo grounds on the planks.
const key = new THREE.DirectionalLight(0xffe0b8, 1.7);
key.position.set(3, 7, 11); key.target.position.set(0, 2.5, 0);
key.castShadow = true; key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.left = -8; key.shadow.camera.right = 8;
key.shadow.camera.top = 9; key.shadow.camera.bottom = -1;
key.shadow.camera.near = 1; key.shadow.camera.far = 30; key.shadow.bias = -0.0006;
scene.add(key, key.target);
const rim = new THREE.DirectionalLight(0x8fb4ff, 0.5); rim.position.set(-7, 5, 6); scene.add(rim);

// ---------------------------------------------------------------------------
// The rack: 3 tiers, 7 slots, same proportions as the 2D game
// ---------------------------------------------------------------------------
const SLOT = 1, TIER = 1.55, SLOTS = 7, TIERS = 3;
const rack = new THREE.Group();
const halfW = (SLOTS * SLOT) / 2 + 0.22;
for (const sx of [-1, 1]) {
  const up = new THREE.Mesh(new THREE.BoxGeometry(0.22, TIER * TIERS + 0.4, 1.3), M.steel);
  up.position.set(sx * halfW, (TIER * TIERS + 0.4) / 2, 0);
  up.castShadow = true; up.receiveShadow = true; rack.add(up);
  const foot = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.08, 1.5), M.steel);
  foot.position.set(sx * halfW, 0.04, 0); rack.add(foot);
}
for (let t = 0; t < TIERS; t++) {
  const y = 0.35 + t * TIER;
  const plank = new THREE.Mesh(new THREE.BoxGeometry(SLOTS * SLOT, 0.14, 1.25), M.steel);
  plank.position.set(0, y, 0); plank.castShadow = true; plank.receiveShadow = true; rack.add(plank);
  const lip = new THREE.Mesh(new THREE.BoxGeometry(SLOTS * SLOT, 0.05, 0.06), M.steelDark);
  lip.position.set(0, y + 0.09, 0.62); rack.add(lip);
}
const cap = new THREE.Mesh(new THREE.BoxGeometry(halfW * 2 + 0.22, 0.16, 1.3), M.steel);
cap.position.set(0, TIER * TIERS + 0.4, 0); cap.castShadow = true; rack.add(cap);
scene.add(rack);

// The wave-9 manifest from the 2D screenshot, so the shots match.
const cargo = [
  { t: 'long', tier: 0, slot: 0, w: 3 }, { t: 'std', tier: 0, slot: 3, w: 1 }, { t: 'long', tier: 0, slot: 4, w: 3 },
  { t: 'std', tier: 1, slot: 3, w: 1 }, { t: 'long', tier: 1, slot: 4, w: 3 },
  { t: 'long', tier: 2, slot: 1, w: 3 },
  { t: 'crate', tier: 1, slot: 1, w: 1 }, { t: 'fragile', tier: 2, slot: 5, w: 1 }, { t: 'priority', tier: 2, slot: 0, w: 1 },
];
const mat = { std: M.cardboard, long: M.long, crate: M.crate, fragile: M.fragile, priority: M.priority };
for (const c of cargo) {
  const w = c.w * SLOT - 0.1, h = 0.86, d = 0.95;
  const geo = new THREE.BoxGeometry(w, h, d, 1, 1, 1);
  const m = new THREE.Mesh(geo, mat[c.t]);
  const x = (c.slot + c.w / 2 - SLOTS / 2) * SLOT;
  const y = 0.35 + c.tier * TIER + 0.07 + h / 2;
  m.position.set(x, y, 0.02);
  m.castShadow = true; m.receiveShadow = true;
  rack.add(m);
}
// Slight lean, like the tilted 2D shot.
rack.rotation.z = -0.045;

// ---------------------------------------------------------------------------
// Post: bloom on the lamps and the emissive priority box only
// ---------------------------------------------------------------------------
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 0.42, 0.7, 0.86);
composer.addPass(bloom);
composer.addPass(new OutputPass());

// ---------------------------------------------------------------------------
// Loop + fps readout the harness can scrape
// ---------------------------------------------------------------------------
let frames = 0, t0 = performance.now(), last = t0;
const deltas = [];
window.__fps = null;
function tick() {
  requestAnimationFrame(tick);
  const now = performance.now();
  deltas.push(now - last); last = now; frames++;
  composer.render();
  if (now - t0 >= 1000) {
    deltas.sort((a, b) => b - a);
    window.__fps = {
      fps: +(frames / ((now - t0) / 1000)).toFixed(1),
      p95FrameMs: +deltas[Math.floor(deltas.length * 0.05)].toFixed(1),
      res: `${renderer.domElement.width}x${renderer.domElement.height}`,
    };
    hud.textContent = `three r170 · ${window.__fps.res} · ${window.__fps.fps} fps · p95 ${window.__fps.p95FrameMs}ms`;
    frames = 0; t0 = now; deltas.length = 0;
  }
}
tick();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  composer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
