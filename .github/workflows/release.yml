name: Release bundle

# Builds the signed Android App Bundle (.aab) that Google Play takes: from a version tag (v1.0.0) or by hand
# (Actions → Release bundle → Run workflow, on main). The upload key comes from the repository's secrets
# (docs/RELEASE.md says how to make it and which secrets to add). Releases are built only from commits on main
# (a run on main, or a tag on one of main's commits), so their numbers only ever go up.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  bundle:
    name: Signed Android App Bundle
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          # The whole history: the build's number counts its commits.
          fetch-depth: 0

      - name: Check the upload key's secrets
        env:
          KEYSTORE: ${{ secrets.CARGO_PANIC_UPLOAD_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.CARGO_PANIC_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.CARGO_PANIC_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.CARGO_PANIC_KEY_PASSWORD }}
        run: |
          missing=""
          [ -n "$KEYSTORE" ] || missing="$missing CARGO_PANIC_UPLOAD_KEYSTORE_BASE64"
          [ -n "$KEYSTORE_PASSWORD" ] || missing="$missing CARGO_PANIC_KEYSTORE_PASSWORD"
          [ -n "$KEY_ALIAS" ] || missing="$missing CARGO_PANIC_KEY_ALIAS"
          [ -n "$KEY_PASSWORD" ] || missing="$missing CARGO_PANIC_KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::The release bundle is signed with the upload key. Add these repository secrets first (Settings → Secrets and variables → Actions; docs/RELEASE.md):$missing"
            exit 1
          fi

      # Google Play takes each upload only numbered higher than the last: main's commit count only ever grows. A tag
      # on a commit outside main would count another branch's commits and could jump far ahead of main, after which
      # Play would refuse every main build until main caught up, so such a tag is refused here.
      - name: Number the build
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::Release builds must come from a commit on main. Tag one of main's commits: git switch main && git pull && git tag vX.Y.Z && git push origin vX.Y.Z"
            exit 1
          fi
          echo "CARGO_PANIC_VERSION_CODE=$(git rev-list --count HEAD)" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      # Capacitor 8 builds with JDK 21.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - run: npm ci

      - name: Typecheck and unit tests
        run: npm run typecheck && npm test

      - name: Build the game into the Android project
        run: npm run android

      - name: Unpack the upload key
        env:
          KEYSTORE: ${{ secrets.CARGO_PANIC_UPLOAD_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/upload.jks"

      # Maven Central through Google's mirror (scripts/gradle/maven-mirror.init.gradle): Central sometimes answers
      # HTTP 429 to CI runners.
      - name: Build the bundle
        working-directory: android
        env:
          CARGO_PANIC_KEYSTORE_FILE: ${{ runner.temp }}/upload.jks
          CARGO_PANIC_KEYSTORE_PASSWORD: ${{ secrets.CARGO_PANIC_KEYSTORE_PASSWORD }}
          CARGO_PANIC_KEY_ALIAS: ${{ secrets.CARGO_PANIC_KEY_ALIAS }}
          CARGO_PANIC_KEY_PASSWORD: ${{ secrets.CARGO_PANIC_KEY_PASSWORD }}
        run: ./gradlew --no-daemon --init-script ../scripts/gradle/maven-mirror.init.gradle bundleRelease

      - name: Forget the upload key
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"

      - name: Upload the bundle
        uses: actions/upload-artifact@v4
        with:
          name: cargo-panic-${{ github.ref_name }}-${{ env.CARGO_PANIC_VERSION_CODE }}
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30
          if-no-files-found: error
