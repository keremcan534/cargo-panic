name: CI

# Every pull request and every push to main: the type check, the unit tests, the build, both level validators and
# the browser tests; and a debug APK to install on a phone (docs/RELEASE.md).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, test, build, validate, e2e
    runs-on: ubuntu-latest
    # The browser tests draw 3D in software (SwiftShader): about 20-25 minutes.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Level and generator validators
        run: npm run validate && npm run validate:endless -- 40 40

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser tests
        run: npm run test:e2e

      - name: Upload the e2e report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore

  android:
    name: Android debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # Numbered by the CI run, so a newer APK installs over an older one and keeps the saved game.
      CARGO_PANIC_VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      # Capacitor 8 builds with JDK 21.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - run: npm ci

      - name: Build the game into the Android project
        run: npm run android

      # Signed with the shared debug key (android/app/debug.keystore), so it installs over the last CI APK. Maven
      # Central through Google's mirror (scripts/gradle/maven-mirror.init.gradle): Central sometimes answers HTTP 429.
      - name: Build the APK
        working-directory: android
        run: ./gradlew --no-daemon --init-script ../scripts/gradle/maven-mirror.init.gradle assembleDebug

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: cargo-panic-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
          if-no-files-found: error
